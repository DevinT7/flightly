name: Flightly
options:
  bundleIdPrefix: com.flightly
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flightly:
    type: application
    platform: iOS
    sources:
      - Flightly
      - Shared
    info:
      path: Flightly/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.flightly.app
            CFBundleURLSchemes: [flightly]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.flightly.app.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flightly.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Flightly
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Flightly scans your calendar for flight events so it can add them automatically.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Flightly scans your calendar for flight events so it can add them automatically.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Flightly uses your location to show nearby airports.
        INFOPLIST_KEY_NSUserActivityTypes: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconNight AppIconSunrise"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: Flightly/Flightly.entitlements
    dependencies:
      - target: FlightlyWidgets
  FlightlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FlightlyWidgets
      - Shared
    info:
      path: FlightlyWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Flightly
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flightly.app.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Flightly
        CODE_SIGN_ENTITLEMENTS: FlightlyWidgets/FlightlyWidgets.entitlements
        SKIP_INSTALL: YES
